<script>
let numeros=[], sorteados=[], cartelaAtual=null;

function iniciar(){
  numeros=Array.from({length:75},(_,i)=>i+1);
  sorteados=[];
}
iniciar();

function sortear(){
  if(!numeros.length) return alert("Todos já foram sorteados!");
  const i=Math.floor(Math.random()*numeros.length);
  const n=numeros.splice(i,1)[0];
  sorteados.push(n);
  document.getElementById("numero").innerText=n;
}

function gerarColuna(min,max){
  let a=[];
  while(a.length<5){
    let n=Math.floor(Math.random()*(max-min+1))+min;
    if(!a.includes(n)) a.push(n);
  }
  return a;
}

function gerarCartela(){
  const B=gerarColuna(1,15),
        I=gerarColuna(16,30),
        N=gerarColuna(31,45),
        G=gerarColuna(46,60),
        O=gerarColuna(61,75);
  N[2]="★";
  cartelaAtual={B,I,N,G,O};

  let h="<table><tr><th>B</th><th>I</th><th>N</th><th>G</th><th>O</th></tr>";
  for(let i=0;i<5;i++){
    h+=`<tr>
      <td>${B[i]}</td>
      <td>${I[i]}</td>
      <td>${N[i]}</td>
      <td>${G[i]}</td>
      <td>${O[i]}</td>
    </tr>`;
  }
  h+="</table>";
  document.getElementById("cartela").innerHTML=h;

  gerarImagem();
}

function gerarImagem(){
  const tabela=document.querySelector(".cartela table");
  if(!tabela) return;

  const cell=80;
  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d");

  canvas.width=cell*5;
  canvas.height=cell*6;

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#fbc02d";
  ctx.fillRect(0,0,canvas.width,cell);

  ctx.fillStyle="#5c0000";
  ctx.font="bold 32px Arial";
  ["B","I","N","G","O"].forEach((l,i)=>{
    ctx.fillText(l,cell*i+28,52);
  });

  ctx.font="26px Arial";
  ctx.fillStyle="#000";

  for(let r=0;r<5;r++){
    for(let c=0;c<5;c++){
      ctx.strokeRect(c*cell,(r+1)*cell,cell,cell);
      ctx.fillText(
        tabela.rows[r+1].cells[c].innerText,
        c*cell+25,
        (r+1)*cell+55
      );
    }
  }

  document.getElementById("imgCartela").src=canvas.toDataURL("image/png");
  document.getElementById("previewImagem").style.display="block";
}

function resetar(){
  iniciar();
  document.getElementById("numero").innerText="--";
  document.getElementById("cartela").innerHTML="";
  document.getElementById("previewImagem").style.display="none";
}
    </script>
