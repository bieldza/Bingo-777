<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo 777 🎰</title>

<style>
body {
  margin: 0;
  font-family: 'Trebuchet MS', Arial, sans-serif;
  background: radial-gradient(circle at top, #ffcc00, #b30000, #3b0000);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  background: linear-gradient(145deg, #8b0000, #ff0000);
  border-radius: 20px;
  padding: 20px;
  width: 95%;
  max-width: 420px;
  text-align: center;
  border: 4px solid gold;
  box-shadow: 0 0 30px gold;
}

h1 {
  color: gold;
  font-size: 36px;
  text-shadow: 2px 2px 0 #b8860b, 0 0 15px gold;
  margin-bottom: 10px;
}

.numero {
  font-size: 72px;
  font-weight: bold;
  color: #5c0000;
  background: radial-gradient(circle, #fff176, #fbc02d);
  border-radius: 50%;
  width: 140px;
  height: 140px;
  margin: 20px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 25px gold, inset 0 0 10px #fff;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

button {
  background: linear-gradient(145deg, gold, orange);
  border: none;
  border-radius: 12px;
  padding: 14px;
  margin: 6px;
  font-size: 16px;
  font-weight: bold;
  color: #5c0000;
  cursor: pointer;
  box-shadow: 0 6px #b8860b;
}

button:active {
  box-shadow: 0 2px #b8860b;
  transform: translateY(4px);
}

.historico {
  margin-top: 15px;
  background: rgba(0,0,0,.3);
  border-radius: 12px;
  padding: 10px;
  color: gold;
  font-weight: bold;
}

.lista {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
}

.lista span {
  background: gold;
  color: #5c0000;
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
  <h1>🎉 BINGO 777 🎉</h1>

  <div class="numero" id="numero">--</div>

  <button onclick="sortear()">🎲 Sortear Número</button>
  <button onclick="resetar()">🔄 Resetar Jogo</button>

  <div class="historico">
    Histórico:
    <div class="lista" id="historico"></div>
  </div>
</div>

<script>
let numeros = [];
let sorteados = [];

for (let i = 1; i <= 75; i++) {
  numeros.push(i);
}

function sortear() {
  if (numeros.length === 0) {
    alert("Todos os números já foram sorteados!");
    return;
  }

  const index = Math.floor(Math.random() * numeros.length);
  const numero = numeros.splice(index, 1)[0];

  sorteados.push(numero);
  document.getElementById("numero").innerText = numero;

  atualizarHistorico();
}

function atualizarHistorico() {
  const hist = document.getElementById("historico");
  hist.innerHTML = "";
  sorteados.forEach(n => {
    const span = document.createElement("span");
    span.innerText = n;
    hist.appendChild(span);
  });
}

function resetar() {
  numeros = [];
  sorteados = [];
  for (let i = 1; i <= 75; i++) numeros.push(i);
  document.getElementById("numero").innerText = "--";
  document.getElementById("historico").innerHTML = "";
}
</script>

</body>
</html>
