<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo 777</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f2f2f7;
}
header{
  background:linear-gradient(135deg,#7b1fa2,#e91e63);
  color:#fff;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}
.card{
  background:#fff;
  margin:15px;
  padding:15px;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
}
.bola-atual{
  width:140px;
  height:140px;
  margin:10px auto;
  border-radius:50%;
  background:radial-gradient(circle,#b2ff59,#2e7d32);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  font-weight:bold;
  color:#1b5e20;
  box-shadow:0 0 20px rgba(0,0,0,.2);
  animation:pulse 1s infinite;
}
@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  color:#fff;
  background:linear-gradient(135deg,#43a047,#66bb6a);
}
button.secondary{
  background:linear-gradient(135deg,#7b1fa2,#ab47bc);
}
.ultimas{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}
.ultimas span{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#e91e63;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}
.painel{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:6px;
}
.painel div{
  padding:8px;
  border-radius:8px;
  text-align:center;
  font-size:13px;
  background:#eee;
}
.painel .ok{
  background:#4caf50;
  color:#fff;
}
.cartela{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-top:10px;
}
.cartela div{
  background:#fafafa;
  padding:12px;
  text-align:center;
  border-radius:8px;
  font-weight:bold;
  border:1px solid #ddd;
}
</style>
</head>

<body>

<header>🎰 BINGO 777</header>

<div class="card">
  <div class="bola-atual" id="bola">--</div>
  <button onclick="sortear()">🎲 Sortear Número</button>
  <button class="secondary" onclick="resetar()">🔄 Novo Jogo</button>
</div>

<div class="card">
  <h3>Últimas bolas</h3>
  <div class="ultimas" id="ultimas"></div>
</div>

<div class="card">
  <h3>Painel de bolas</h3>
  <div class="painel" id="painel"></div>
</div>

<div class="card">
  <h3>Gerar Cartela</h3>
  <button onclick="gerarCartela()">📥 Gerar e Baixar Cartela</button>
  <div id="cartela" class="cartela"></div>
</div>

<script>
let numeros=[...Array(75).keys()].map(n=>n+1);
let sorteados=[];

const painel=document.getElementById("painel");
for(let i=1;i<=75;i++){
  const d=document.createElement("div");
  d.id="p"+i;
  d.innerText=i;
  painel.appendChild(d);
}

function sortear(){
  if(numeros.length===0){alert("Fim do jogo");return;}
  const i=Math.floor(Math.random()*numeros.length);
  const n=numeros.splice(i,1)[0];
  sorteados.push(n);
  document.getElementById("bola").innerText=n;
  document.getElementById("p"+n).classList.add("ok");
  atualizarUltimas();
}

function atualizarUltimas(){
  const u=document.getElementById("ultimas");
  u.innerHTML="";
  sorteados.slice(-6).reverse().forEach(n=>{
    const s=document.createElement("span");
    s.innerText=n;
    u.appendChild(s);
  });
}

function resetar(){
  location.reload();
}

function gerarCartela(){
  const nums=[...Array(75).keys()].map(n=>n+1).sort(()=>0.5-Math.random()).slice(0,25);
  const c=document.getElementById("cartela");
  c.innerHTML="";
  nums.forEach(n=>{
    const d=document.createElement("div");
    d.innerText=n;
    c.appendChild(d);
  });

  html2canvas(c).then(canvas=>{
    const link=document.createElement("a");
    link.download="cartela-bingo.png";
    link.href=canvas.toDataURL();
    link.click();
  });
}
</script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</body>
</html>
