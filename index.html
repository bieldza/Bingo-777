<style>
body{
  margin:0;
  font-family:Trebuchet MS,Arial;
  background:radial-gradient(circle at top,#ffcc00,#b30000,#3b0000);
}

.hidden{display:none}

header{
  background:linear-gradient(145deg,#8b0000,#ff0000);
  color:gold;
  padding:15px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  text-shadow:2px 2px 0 #b8860b,0 0 15px gold;
  border-bottom:4px solid gold;
}

.card{
  background:linear-gradient(145deg,#8b0000,#ff0000);
  margin:15px;
  padding:15px;
  border-radius:20px;
  border:3px solid gold;
  box-shadow:0 0 25px gold;
  color:gold;
}

.bola{
  width:140px;
  height:140px;
  margin:10px auto;
  border-radius:50%;
  background:radial-gradient(circle,#fff176,#fbc02d);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:64px;
  font-weight:bold;
  color:#5c0000;
  box-shadow:0 0 25px gold,inset 0 0 10px #fff;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  color:#5c0000;
  background:linear-gradient(145deg,gold,orange);
  cursor:pointer;
  box-shadow:0 6px #b8860b;
}

button:active{
  box-shadow:0 2px #b8860b;
  transform:translateY(4px);
}

button.sec{
  background:linear-gradient(145deg,#ff5252,#b30000);
  color:#fff;
}

.ultimas span{
  width:40px;
  height:40px;
  border-radius:50%;
  background:gold;
  color:#5c0000;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin:4px;
  font-weight:bold;
}

.painel{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:6px;
}

.painel div{
  padding:8px;
  border-radius:8px;
  background:rgba(255,255,255,.8);
  text-align:center;
  color:#5c0000;
  font-weight:bold;
}

.ok{
  background:#4caf50 !important;
  color:#fff !important;
}

.cartela{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.cartela div{
  background:#fff;
  padding:12px;
  text-align:center;
  border-radius:8px;
  border:2px solid gold;
  font-weight:bold;
  color:#5c0000;
  cursor:pointer;
}

.cartela .ok{
  background:#4caf50;
  color:#fff;
}

.input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:2px solid gold;
  background:#fff8e1;
  font-size:16px;
}

.hist{
  font-size:13px;
  background:rgba(0,0,0,.6);
  color:#fff;
  padding:10px;
  border-radius:10px;
  max-height:180px;
  overflow:auto;
}

.hist b{
  color:gold;
}
  </style>
