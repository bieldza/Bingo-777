<script>
let numeros=[], sorteados=[], cartelaAtual=null;

function iniciar(){
  numeros=Array.from({length:75},(_,i)=>i+1);
  sorteados=[];
  carregarHistorico();
}
iniciar();

function sortear(){
  if(!numeros.length) return alert("Todos os números foram sorteados!");
  const i=Math.floor(Math.random()*numeros.length);
  const n=numeros.splice(i,1)[0];
  sorteados.push(n);
  document.getElementById("numero").innerText=n;
  document.getElementById("historicoAtual").innerText=sorteados.join(", ");
}

function gerarColuna(min,max){
  let a=[];
  while(a.length<5){
    let n=Math.floor(Math.random()*(max-min+1))+min;
    if(!a.includes(n)) a.push(n);
  }
  return a;
}

function gerarCartela(){
  const B=gerarColuna(1,15),
        I=gerarColuna(16,30),
        N=gerarColuna(31,45),
        G=gerarColuna(46,60),
        O=gerarColuna(61,75);
  N[2]="★";
  cartelaAtual={B,I,N,G,O};

  let h="<table><tr><th>B</th><th>I</th><th>N</th><th>G</th><th>O</th></tr>";
  for(let i=0;i<5;i++){
    h+=`<tr>
      <td>${B[i]}</td>
      <td>${I[i]}</td>
      <td>${N[i]}</td>
      <td>${G[i]}</td>
      <td>${O[i]}</td>
    </tr>`;
  }
  h+="</table>";
  document.getElementById("cartela").innerHTML=h;

  baixarCartelaImagem();
}

/* 🔽 CONVERTE CARTELA EM IMAGEM E BAIXA */
function baixarCartelaImagem(){
  const tabela = document.querySelector(".cartela table");
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  const cell = 60;
  canvas.width = cell * 5;
  canvas.height = cell * 6;

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#fbc02d";
  ctx.fillRect(0,0,canvas.width,cell);

  ctx.fillStyle = "#5c0000";
  ctx.font = "bold 24px Arial";
  ["B","I","N","G","O"].forEach((l,i)=>{
    ctx.fillText(l, cell*i+22, 38);
  });

  ctx.font = "20px Arial";
  ctx.fillStyle = "#000";

  for(let r=0;r<5;r++){
    for(let c=0;c<5;c++){
      ctx.strokeRect(c*cell,(r+1)*cell,cell,cell);
      ctx.fillText(
        tabela.rows[r+1].cells[c].innerText,
        c*cell+20,
        (r+1)*cell+38
      );
    }
  }

  const link = document.createElement("a");
  link.download = "cartela-bingo-777.png";
  link.href = canvas.toDataURL();
  link.click();
}

function finalizarJogo(){
  if(!sorteados.length) return alert("Nenhum número sorteado.");
  const jogos=JSON.parse(localStorage.getItem("bingo777"))||[];
  jogos.push({
    data:new Date().toLocaleString(),
    sorteados:[...sorteados],
    cartela:cartelaAtual
  });
  localStorage.setItem("bingo777",JSON.stringify(jogos));
  carregarHistorico();
}

function carregarHistorico(){
  const jogos=JSON.parse(localStorage.getItem("bingo777"))||[];
  const div=document.getElementById("historicoJogos");
  div.innerHTML="";
  jogos.forEach((j,i)=>{
    div.innerHTML+=`
      <div>
        <b>Jogo ${i+1}</b><br>
        🕒 ${j.data}<br>
        🎲 ${j.sorteados.join(", ")}
        <hr>
      </div>`;
  });
}

function resetar(){
  iniciar();
  document.getElementById("numero").innerText="--";
  document.getElementById("historicoAtual").innerText="";
  document.getElementById("cartela").innerHTML="";
}
  </script>
