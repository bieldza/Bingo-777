<script>
function prepararDownloadCartela(){
  if(!cartelaAtual) return;

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = 500;
  canvas.height = 600;

  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#b30000";
  ctx.font = "bold 32px Arial";
  ctx.textAlign = "center";
  ctx.fillText("BINGO 777", canvas.width/2, 40);

  const letras = ["B","I","N","G","O"];
  const colunas = cartelaAtual;

  const x0 = 50, y0 = 80, w = 80, h = 80;

  ctx.font = "bold 26px Arial";
  letras.forEach((l,i)=>{
    ctx.fillStyle="gold";
    ctx.fillRect(x0+i*w,y0,w,h);
    ctx.fillStyle="#5c0000";
    ctx.fillText(l,x0+i*w+w/2,y0+55);
  });

  ctx.font="24px Arial";
  for(let r=0;r<5;r++){
    for(let c=0;c<5;c++){
      ctx.strokeRect(x0+c*w,y0+(r+1)*h,w,h);
      ctx.fillStyle="#000";
      ctx.fillText(
        colunas[letras[c]][r],
        x0+c*w+w/2,
        y0+(r+1)*h+55
      );
    }
  }

  const link = document.createElement("a");
  link.href = canvas.toDataURL("image/png");
  link.download = "cartela-bingo-777.png";
  link.innerText = "⬇️ Baixar Cartela";
  link.style.display = "inline-block";
  link.style.marginTop = "10px";
  link.style.padding = "10px";
  link.style.background = "gold";
  link.style.borderRadius = "10px";
  link.style.color = "#000";
  link.style.fontWeight = "bold";
  link.style.textDecoration = "none";

  const area = document.getElementById("downloadArea");
  area.innerHTML = "";
  area.appendChild(link);
}
  </script>
